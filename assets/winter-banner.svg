      <stop offset="0%" stop-color="#050B16"/>
      <stop offset="45%" stop-color="#0D1B2A"/>
      <stop offset="100%" stop-color="#07111F"/>
    </linearGradient>

    <linearGradient id="ice" x1="0" y1="0" x2="1600" y2="0">
      <stop offset="0%" stop-color="#5DADE2"/>
      <stop offset="50%" stop-color="#EAF6FF"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="420" fill="url(#bg)"/>

  <g opacity="0.9">
