    <circle cx="180" cy="115" r="1.5" fill="#EAF6FF"/>
    <circle cx="300" cy="45" r="2" fill="#A7D8FF"/>
    <circle cx="480" cy="95" r="1.5" fill="#EAF6FF"/>
    <circle cx="630" cy="55" r="2" fill="#A7D8FF"/>
    <circle cx="830" cy="95" r="1.5" fill="#EAF6FF"/>
    <circle cx="1030" cy="40" r="2" fill="#A7D8FF"/>
    <circle cx="1230" cy="100" r="1.5" fill="#EAF6FF"/>
    <circle cx="1390" cy="55" r="2" fill="#A7D8FF"/>
    <circle cx="1510" cy="130" r="1.5" fill="#EAF6FF"/>
  </g>

  <g stroke="#38BDF8" stroke-width="1" opacity="0.35">
