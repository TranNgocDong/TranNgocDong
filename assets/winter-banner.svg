  <line x1="430" y1="195" x2="730" y2="195" stroke="#A7D8FF" stroke-width="2" opacity="0.9"/>
  <line x1="870" y1="195" x2="1170" y2="195" stroke="#A7D8FF" stroke-width="2" opacity="0.9"/>

  <text x="800" y="235" text-anchor="middle"
