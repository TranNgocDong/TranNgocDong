  </text>

  <text x="800" y="280" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="24" font-weight="500"
        fill="#7DD3FC">
    Silent • Focused • Always Learning
  </text>

  <rect x="0" y="405" width="1600" height="4" fill="#38BDF8" opacity="0.6"/>

  <!-- Snowfall -->
<g opacity="0.9">
  <circle cx="120" cy="-20" r="3" fill="#EAF6FF">
    <animate attributeName="cy" from="-20" to="440" dur="6s" repeatCount="indefinite"/>
  </circle>

  <circle cx="260" cy="-40" r="2" fill="#EAF6FF">
    <animate attributeName="cy" from="-40" to="440" dur="8s" repeatCount="indefinite"/>
  </circle>

  <circle cx="420" cy="-15" r="3" fill="#A7D8FF">
    <animate attributeName="cy" from="-15" to="440" dur="7s" repeatCount="indefinite"/>
  </circle>

  <circle cx="650" cy="-35" r="2" fill="#EAF6FF">
    <animate attributeName="cy" from="-35" to="440" dur="9s" repeatCount="indefinite"/>
  </circle>

  <circle cx="880" cy="-10" r="3" fill="#A7D8FF">
    <animate attributeName="cy" from="-10" to="440" dur="5.5s" repeatCount="indefinite"/>
  </circle>

  <circle cx="1120" cy="-25" r="2" fill="#EAF6FF">
    <animate attributeName="cy" from="-25" to="440" dur="7.5s" repeatCount="indefinite"/>
  </circle>

  <circle cx="1360" cy="-18" r="3" fill="#A7D8FF">
    <animate attributeName="cy" from="-18" to="440" dur="6.5s" repeatCount="indefinite"/>
  </circle>

  <circle cx="1500" cy="-30" r="2" fill="#EAF6FF">
    <animate attributeName="cy" from="-30" to="440" dur="8.5s" repeatCount="indefinite"/>
  </circle>
</g>

  <!-- Ice Guardian -->
<g transform="translate(80 220)">
  
  <!-- body -->
  <circle cx="60" cy="90" r="42"
          fill="#D6F0FF"
          stroke="#A7D8FF"
          stroke-width="3"/>

  <circle cx="60" cy="35" r="28"
          fill="#EAF6FF"
          stroke="#A7D8FF"
          stroke-width="3"/>

  <!-- eyes -->
  <circle cx="50" cy="30" r="2.5" fill="#0D1117"/>
  <circle cx="70" cy="30" r="2.5" fill="#0D1117"/>

  <!-- smile -->
  <path d="M50 45 Q60 52 70 45"
        stroke="#38BDF8"
        stroke-width="2"
        fill="none"/>

  <!-- left arm -->
  <line x1="28" y1="82" x2="-10" y2="60"
        stroke="#A7D8FF"
        stroke-width="4"/>

  <!-- right arm -->
  <line x1="92" y1="82" x2="130" y2="60"
        stroke="#A7D8FF"
        stroke-width="4"/>

  <!-- snowball -->
  <circle cx="145" cy="55" r="8"
          fill="#EAF6FF"
          stroke="#38BDF8"
          stroke-width="2">
      <animate attributeName="cx"
               values="145;175;145"
               dur="2.5s"
               repeatCount="indefinite"/>
  </circle>

</g>
</svg>
