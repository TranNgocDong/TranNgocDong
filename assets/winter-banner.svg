    <circle cx="1370" cy="90" r="5" fill="#38BDF8"/>
    <circle cx="310" cy="300" r="5" fill="#38BDF8"/>
    <circle cx="1280" cy="300" r="5" fill="#38BDF8"/>
  </g>

  <g opacity="0.95">
    <path d="M0 350 L180 180 L330 350 Z" fill="#102A43"/>
    <path d="M120 350 L310 130 L520 350 Z" fill="#163B5C"/>
    <path d="M430 350 L670 160 L910 350 Z" fill="#102A43"/>
    <path d="M760 350 L980 120 L1210 350 Z" fill="#163B5C"/>
    <path d="M1080 350 L1320 150 L1600 350 Z" fill="#102A43"/>

    <path d="M180 180 L220 255 L160 235 Z" fill="#EAF6FF" opacity="0.75"/>
    <path d="M310 130 L355 230 L270 210 Z" fill="#EAF6FF" opacity="0.8"/>
    <path d="M670 160 L720 245 L625 230 Z" fill="#EAF6FF" opacity="0.75"/>
    <path d="M980 120 L1035 230 L930 210 Z" fill="#EAF6FF" opacity="0.8"/>
    <path d="M1320 150 L1380 245 L1265 225 Z" fill="#EAF6FF" opacity="0.75"/>
  </g>

  <path d="M0 350 C250 330 430 380 650 350 C850 320 1050 375 1260 350 C1420 330 1530 355 1600 345 V420 H0 Z" fill="#0B1628"/>
  <path d="M0 360 C250 340 430 390 650 360 C850 330 1050 385 1260 360 C1420 340 1530 365 1600 355" stroke="#5DADE2" stroke-width="2" opacity="0.7"/>

  <g transform="translate(145 130)">
    <path d="M70 0 L130 25 V85 C130 125 100 155 70 170 C40 155 10 125 10 85 V25 Z" stroke="#A7D8FF" stroke-width="4" fill="#5DADE2" fill-opacity="0.08"/>
    <rect x="48" y="72" width="44" height="42" rx="6" stroke="#EAF6FF" stroke-width="4"/>
    <path d="M58 72 V55 C58 38 82 38 82 55 V72" stroke="#EAF6FF" stroke-width="4"/>
    <circle cx="70" cy="94" r="5" fill="#38BDF8"/>
  </g>

  <g transform="translate(1280 140)" stroke="#A7D8FF" stroke-width="3">
    <circle cx="30" cy="40" r="10" fill="#0D1117"/>
    <circle cx="120" cy="20" r="10" fill="#0D1117"/>
    <circle cx="190" cy="80" r="10" fill="#0D1117"/>
    <circle cx="90" cy="120" r="10" fill="#0D1117"/>
    <path d="M40 38 L110 22"/>
    <path d="M130 25 L182 73"/>
    <path d="M182 86 L100 118"/>
    <path d="M85 114 L36 48"/>
  </g>

  <g transform="translate(800 235)" stroke="#EAF6FF" stroke-width="3" opacity="0.9">
